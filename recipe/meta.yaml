{% set version = "1.9.2" %}
{% set python_min = "3.10" %}

package:
  name: panel-core
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/p/panel/panel-{{ version }}.tar.gz
  sha256: ede8daa7a2515a2f3b49f19ed9aff75fcef48d6d8c3b9df3a4ebf26a551a0407

build:
  number: 0

outputs:
  - name: panel-core
    build:
      noarch: python
      script: python -m pip install . -vv
      entry_points:
        - panel = panel.command:main
    requirements:
      host:
        - python {{ python_min }}
        - pip
        - nodejs >=18
        # These are also needed at build time.
        - hatchling
        - hatch-vcs
        - param >=2.1.0
        - bokeh >=3.8.0,<3.10.0
        - pyviz_comms >=0.7.4
        - requests
        - packaging
      run:
        - python >={{ python_min }}
        - bokeh >=3.7.0,<3.10.0
        - param >=2.1.0,<3.0
        - pyviz_comms >=2.0.0
        - markdown
        - markdown-it-py
        - linkify-it-py
        - mdit-py-plugins
        - narwhals >=2
        - requests
        - nh3
        - typing_extensions
        - pandas >=1.2
        - packaging
        - tqdm
      run_constrained:
        - holoviews >=1.18.0
    test:
      imports:
        - panel
        - panel.io
      commands:
        - pip check
        - panel --help
      requires:
        - python {{ python_min }}
        - pip

  - name: panel
    build:
      noarch: python
    requirements:
      - python >={{ python_min }}
      - {{ pin_subpackage('panel-core', exact=True) }}
      # - panel-material-ui >=0.10.0  # Add back after panel-core release
    test:
      imports:
        - panel
      requires:
        - python {{ python_min }}
        - pip
      commands:
        - pip check
    about:
      home: https://panel.holoviz.org
      summary: The powerful data exploration & web app framework for Python.
      description: |
        Panel provides tools for easily composing widgets, plots, tables, and other
        viewable objects and controls into control panels, apps, and dashboards.
      license: BSD-3-Clause
      license_file: LICENSE.txt

about:
  home: https://panel.holoviz.org
  summary: The powerful data exploration & web app framework for Python.
  description: |
    Panel provides tools for easily composing widgets, plots, tables, and other
    viewable objects and controls into control panels, apps, and dashboards.
  license: BSD-3-Clause
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - hoxbro
    - philippjfr
    - ocefpaf
    - maximlt
